name: Build Windows App

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload tray app artifact
        uses: actions/upload-artifact@v4
        with:
          name: tray-app-windows-x64
          path: build/Release/tray-app.exe
          if-no-files-found: error

      - name: Upload tray service artifact
        uses: actions/upload-artifact@v4
        with:
          name: tray-service-windows-x64
          path: build/Release/tray-service.exe
          if-no-files-found: error

      - name: Upload tray control artifact
        uses: actions/upload-artifact@v4
        with:
          name: tray-control-windows-x64
          path: build/Release/tray-control.exe
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyBuildDir=$((Resolve-Path build/Release).Path)" `
            "installer/tray-antivirus.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tray-antivirus-installer
          path: build/Release/tray-antivirus-setup.exe
          if-no-files-found: error
